[project]
name = "genesys-mcp"
version = "1.22.1"
description = "Local stdio MCP server exposing read-only Genesys Cloud access to Claude Code and other MCP clients"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: Other/Proprietary License",
]
dependencies = [
    # <2: mcp 2.0.0 removed mcp.server.fastmcp, which every tool module
    # imports. Environments that install without the lockfile (e.g. plain
    # `pip install -e` image builds) resolve latest and crash on import.
    "mcp[cli]>=1.8,<2",
    "PureCloudPlatformClientV2>=220",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.scripts]
genesys-mcp = "genesys_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesys_mcp"]

[dependency-groups]
test = [
    "pytest>=8.0",
    "beautifulsoup4>=4.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",                # short summary for everything except passes
    "--strict-markers",
    "--strict-config",
]
