[project]
name = "genesys-mcp"
version = "0.9.1"
description = "Local stdio MCP server exposing read-only Genesys Cloud access to Claude Code and other MCP clients"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.8",
    "PureCloudPlatformClientV2>=220",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.scripts]
genesys-mcp = "genesys_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesys_mcp"]

[dependency-groups]
test = [
    "pytest>=8.0",
    "beautifulsoup4>=4.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",                # short summary for everything except passes
    "--strict-markers",
    "--strict-config",
]
